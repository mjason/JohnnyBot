name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0
        type: string
      verify_only:
        description: Verify an ad hoc signed build without publishing
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-macos-${{ inputs.version || github.ref_name }}

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      VERIFY_ONLY: ${{ inputs.verify_only || false }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release source
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Use a version tag like v1.0.0."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Dispatch macOS releases from main."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The release commit must be on main."
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          if tagged_commit="$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}")" &&
             [[ "$tagged_commit" != "$commit" ]]; then
            echo "::error::This tag already points to a different commit."
            exit 1
          fi
          printf 'RELEASE_COMMIT=%s\n' "$commit" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Import Developer ID identity
        if: ${{ !inputs.verify_only }}
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for secret in APPLE_DEVELOPER_ID_P12_BASE64 APPLE_DEVELOPER_ID_P12_PASSWORD \
                        APPLE_NOTARY_KEY_P8_BASE64 APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing Actions secret $secret."
              exit 1
            fi
          done

          umask 077
          keychain="$RUNNER_TEMP/johnnybot-release.keychain-db"
          certificate="$(mktemp "$RUNNER_TEMP/developer-id.XXXXXX")"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 4200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"

          for intermediate in DeveloperIDCA DeveloperIDG2CA; do
            ca_file="$RUNNER_TEMP/$intermediate.cer"
            curl --fail --silent --show-error --retry 3 \
              "https://www.apple.com/certificateauthority/$intermediate.cer" --output "$ca_file"
            security import "$ca_file" -k "$keychain"
          done
          security import "$certificate" -f pkcs12 -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null

          identity="$(security find-identity -v -p codesigning "$keychain" |
            awk '/"Developer ID Application:/ { print; count++ } END { if (count != 1) exit 1 }')" || {
            echo "::error::The P12 must contain one valid Developer ID Application identity and its private key."
            exit 1
          }
          fingerprint="$(awk '{print $2}' <<< "$identity")"
          team="$(sed -E 's/.*\(([A-Z0-9]{10})\)".*/\1/' <<< "$identity")"
          [[ "$fingerprint" =~ ^[A-F0-9]{40}$ && "$team" =~ ^[A-Z0-9]{10}$ ]]
          printf 'SIGNING_FINGERPRINT=%s\nSIGNING_TEAM=%s\n' "$fingerprint" "$team" >> "$GITHUB_ENV"

      - name: Build universal macOS app
        run: |
          signing=("CODE_SIGN_IDENTITY=-")
          if [[ "$VERIFY_ONLY" != true ]]; then
            signing=(
              "CODE_SIGN_IDENTITY=$SIGNING_FINGERPRINT"
              "DEVELOPMENT_TEAM=$SIGNING_TEAM"
              "OTHER_CODE_SIGN_FLAGS=--timestamp --keychain \"$RUNNER_TEMP/johnnybot-release.keychain-db\""
            )
          fi
          xcodebuild -project JohnnyBot.xcodeproj -scheme JohnnyBot -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/JohnnyBotBuild" \
            -onlyUsePackageVersionsFromResolvedFile -skipPackagePluginValidation -skipMacroValidation \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGN_STYLE=Manual ENABLE_HARDENED_RUNTIME=YES \
            "MARKETING_VERSION=${RELEASE_TAG#v}" "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" \
            "${signing[@]}" build

      - name: Verify app and signature
        run: |
          app="$RUNNER_TEMP/JohnnyBotBuild/Build/Products/Release/JohnnyBot.app"
          lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/JohnnyBot"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          grep -Eq 'flags=0x[[:xdigit:]]+\([^)]*runtime' <<< "$signature"
          codesign --display --entitlements - "$app" > "$RUNNER_TEMP/johnnybot-entitlements.plist"
          entitlements="$RUNNER_TEMP/johnnybot-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$entitlements")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.network.client' "$entitlements")" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$entitlements" 2>/dev/null || true)" != true
          if [[ "$VERIFY_ONLY" != true ]]; then
            grep -q '^Authority=Developer ID Application:' <<< "$signature"
            grep -Fxq "TeamIdentifier=$SIGNING_TEAM" <<< "$signature"
            grep -q '^Timestamp=' <<< "$signature"
          fi

      - name: Notarize and staple
        if: ${{ !inputs.verify_only }}
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          umask 077
          key_dir="$(mktemp -d "$RUNNER_TEMP/notary-key.XXXXXX")"
          key="$key_dir/AuthKey.p8"
          trap 'rm -f "$key"; rmdir "$key_dir"' EXIT
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$key"
          credentials=(--key "$key" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID")
          app="$RUNNER_TEMP/JohnnyBotBuild/Build/Products/Release/JohnnyBot.app"
          submission="$RUNNER_TEMP/JohnnyBot-notary.zip"
          response="$RUNNER_TEMP/notary-response.json"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$submission"
          if ! xcrun notarytool submit "$submission" "${credentials[@]}" --wait --timeout 45m \
               --output-format json > "$response" || ! jq -e '.status == "Accepted"' "$response"; then
            cat "$response"
            if id="$(jq -er '.id' "$response")"; then
              xcrun notarytool log "$id" "${credentials[@]}" || true
            fi
            exit 1
          fi
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          syspolicy_check distribution "$app"

      - name: Publish GitHub release
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          app="$RUNNER_TEMP/JohnnyBotBuild/Build/Products/Release/JohnnyBot.app"
          archive="JohnnyBot-${RELEASE_TAG#v}-macOS-universal.zip"
          mkdir "$RUNNER_TEMP/dist"
          cd "$RUNNER_TEMP/dist"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" --title "JohnnyBot ${RELEASE_TAG#v}" --generate-notes

      - name: Remove temporary signing keychain
        if: ${{ always() && !inputs.verify_only }}
        run: |
          keychain="$RUNNER_TEMP/johnnybot-release.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
